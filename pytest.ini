[pytest]
testpaths = tests
pythonpath = backend

# Skip slow/live tests by default unless explicitly requested
# To run live API tests: pytest --run-live
# To run ngspice tests: install ngspice and they auto-enable via shutil.which()

markers =
    live: marks tests as requiring a live API key (auto-skipped when ANTHROPIC_API_KEY is empty)
    slow: marks tests as slow (simulation, compilation)
