; RC time-constant timer for the D1 bench sheet (docs/BENCH_D1.md).
; Build:  pio run -d scripts/bench/rc_timer
; Upload: pio run -d scripts/bench/rc_timer -t upload
; Watch:  pio device monitor -b 115200

[env:uno]
platform = atmelavr@5.3.0   ; the version generators/firmware/project.py pins
board = uno
framework = arduino
monitor_speed = 115200
